# Full stack: MySQL + Redis + Python model service + Spring Boot API.
# Train a model first (see README) so ./ml-service/models/model.joblib exists.
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ids
      MYSQL_USER: ids
      MYSQL_PASSWORD: ids
      MYSQL_ROOT_PASSWORD: root
    ports: ["3306:3306"]
    volumes: [mysql-data:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uids", "-pids"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  ml-service:
    build: ./ml-service
    ports: ["8000:8000"]
    volumes: ["./ml-service/models:/app/models:ro"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      retries: 20

  api-service:
    build: ./api-service
    ports: ["8080:8080"]
    environment:
      DB_URL: jdbc:mysql://mysql:3306/ids
      DB_USERNAME: ids
      DB_PASSWORD: ids
      REDIS_HOST: redis
      ML_SERVICE_URL: http://ml-service:8000
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      ml-service: { condition: service_healthy }

volumes:
  mysql-data:
